name: Deploy H5 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 授予 Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署，新提交取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 旧版 npm 在该依赖树上偶发 "Exit handler never called!" 崩溃并残留半装的
      # node_modules（导致 taro 命令缺失），升级到最新 npm 规避该 bug。
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        # vitest 引入 vite@5，而 @tarojs/plugin-framework-react@4.0.9 的 peer 要求 vite@4，
        # 二者仅为 peerOptional 冲突，用 legacy-peer-deps 放行（与本地安装策略一致）。
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build H5
        run: npm run build:h5
        env:
          NODE_ENV: production

      # 关闭 Jekyll 处理，避免下划线开头的资源被忽略
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
